spring.application.name=usuario-service
api.version=v1
server.port=8083

# OAuth2 Resource Server — valida tokens JWT del bearer que llega desde Angular
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/curso-springboot}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/curso-springboot/protocol/openid-connect/certs}

# Keycloak Admin Client — service account para gestionar usuarios
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8090}
keycloak.realm=${KEYCLOAK_REALM:curso-springboot}
keycloak.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:usuario-service}
keycloak.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:usuario-service-secret}

management.endpoints.web.exposure.include=health
logging.level.web=INFO

# MinIO — almacenamiento de objetos compatible con S3
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:avatars}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# Tamaño máximo de archivo permitido en uploadsdocker ps
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
