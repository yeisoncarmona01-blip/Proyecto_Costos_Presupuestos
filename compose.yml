services:

  postgres:
    image: postgres:16
    container_name: softcost-db

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d softcostdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    environment:
      POSTGRES_DB: softcostdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: softcost-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/softcostdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  presupuesto:
    image: andresfran/horas-service:1.0
    container_name: softcost-presupuesto
    depends_on:
      - backend
    ports:
      - "8082:8080"

  horas:
    image: juanchoo/presupuesto-calculator:1.0
    container_name: softcost-horas
    depends_on:
      - backend
    ports:
      - "8081:8080"

  reportes:
    image: juanchoo/generador-reportes-service:1.0
    container_name: softcost-reportes
    depends_on:
      - backend
    ports:
      - "8083:8080"

  costos:
    image: yeisoncrack/costos-service:1.0
    container_name: softcost-costos
    depends_on:
      - backend
    ports:
      - "8084:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: softcost-frontend
    depends_on:
      - backend
      - presupuesto
      - horas
      - reportes
    environment:
      PORT: 4000
    ports:
      - "4200:4000"
